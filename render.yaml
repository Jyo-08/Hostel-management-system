services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: hostelos-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: HOSTELOS_DB_MODE
        value: neo4j
      - key: ALLOWED_ORIGINS
        sync: false

  # 2. React + Vite Frontend Static Site
  - type: web
    name: hostelos-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://hostel-management-system-s821.onrender.com
